services:
  postgres:
    image: postgres:16
    container_name: spacy-pg
    environment:
      POSTGRES_USER: spacy
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: spacy
    ports:
      - '5432:5432'
    volumes:
      - spacy-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spacy -d spacy']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  spacy-pg-data:
