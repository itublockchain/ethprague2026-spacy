<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Spacy — sign in with Google, sign across orbit">
  <title>Spacy — sign in with Google, sign across orbit</title>
  <defs>
    <radialGradient id="bg" cx="22%" cy="50%" r="78%">
      <stop offset="0%"  stop-color="#1a0b2e"/>
      <stop offset="55%" stop-color="#08040f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbb7ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- Faint starfield -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="120"  cy="60"  r="0.9"/>
    <circle cx="240"  cy="300" r="1.1"/>
    <circle cx="360"  cy="40"  r="0.7"/>
    <circle cx="510"  cy="320" r="0.9"/>
    <circle cx="640"  cy="80"  r="1.0"/>
    <circle cx="780"  cy="40"  r="0.8"/>
    <circle cx="900"  cy="320" r="1.1"/>
    <circle cx="1040" cy="60"  r="0.9"/>
    <circle cx="1170" cy="280" r="1.0"/>
    <circle cx="1200" cy="100" r="0.7"/>
    <circle cx="80"   cy="200" r="0.6"/>
    <circle cx="430"  cy="180" r="0.5"/>
    <circle cx="700"  cy="240" r="0.6"/>
    <circle cx="990"  cy="200" r="0.7"/>
  </g>

  <!-- Orbital arcs (right side) -->
  <g transform="translate(960 180)" fill="none" stroke-width="1.25">
    <circle r="180" stroke="url(#ring)" opacity="0.9"/>
    <circle r="138" stroke="#ffffff" stroke-opacity="0.18" stroke-dasharray="2 6"/>
    <circle r="96"  stroke="#a78bfa" stroke-opacity="0.35"/>
    <!-- satellite tick -->
    <g transform="rotate(-32) translate(180 0)">
      <circle r="5" fill="#ffffff"/>
      <circle r="11" fill="none" stroke="#ffffff" stroke-opacity="0.5"/>
      <circle r="20" fill="none" stroke="#a78bfa" stroke-opacity="0.45"/>
    </g>
    <!-- inner pulse -->
    <circle r="4" fill="#ffffff" opacity="0.85"/>
    <circle r="10" fill="none" stroke="#ffffff" stroke-opacity="0.45"/>
  </g>

  <!-- Logo mark (left) -->
  <g transform="translate(120 180) scale(0.62)">
    <g transform="rotate(-22)" fill="#ffffff" fill-rule="evenodd">
      <path d="M -86 -78 L -34 -78 L -34 -58 L -52 -58 L -52 58 L -34 58 L -34 78 L -86 78 L -86 58 L -68 58 L -68 -58 L -86 -58 Z"/>
      <path d="M 34 -78 L 86 -78 L 86 -58 L 68 -58 L 68 58 L 86 58 L 86 78 L 34 78 L 34 58 L 52 58 L 52 -58 L 34 -58 Z"/>
      <path d="M -34 -22 L -8 -22 L -8 -2 L 8 -2 L 8 -22 L 34 -22 L 34 22 L 8 22 L 8 2 L -8 2 L -8 22 L -34 22 Z"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(260 165)">
    <text x="0" y="0"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="92" font-weight="700" letter-spacing="14"
          fill="url(#wm)">SPACY</text>
    <text x="4" y="44"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="18" letter-spacing="6"
          fill="#a78bfa" opacity="0.85">SIGN&#160;ACROSS&#160;ORBIT</text>
    <text x="4" y="86"
          font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="20" fill="#e6e1ff" opacity="0.9">
      Sign in with Google. No seed phrase. Verifiable cosmic entropy.
    </text>
  </g>

  <!-- Subtle scanline divider at bottom -->
  <line x1="0" y1="358" x2="1280" y2="358" stroke="#a78bfa" stroke-opacity="0.35"/>
</svg>
