<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="Spacy — Privy for the post-quantum world">
  <title>Spacy — Privy for the post-quantum world</title>
  <defs>
    <g id="s">
      <path d="M 0,-3 L 0.45,-0.45 L 3,0 L 0.45,0.45 L 0,3 L -0.45,0.45 L -3,0 L -0.45,-0.45 Z"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1280" height="440" fill="#000000"/>

  <!-- tilted orbit ellipse -->
  <g transform="translate(640 230) rotate(-16)" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1">
    <ellipse rx="600" ry="200"/>
  </g>

  <!-- starfield (4-point sparkles) -->
  <g fill="#f5ede0" opacity="0.95">
    <!-- top band -->
    <use href="#s" transform="translate(45 25) scale(0.7)"/>
    <use href="#s" transform="translate(108 72) scale(0.55)"/>
    <use href="#s" transform="translate(175 32) scale(0.85)"/>
    <use href="#s" transform="translate(232 96) scale(0.6)"/>
    <use href="#s" transform="translate(292 50) scale(0.7)"/>
    <use href="#s" transform="translate(360 82) scale(0.55)"/>
    <use href="#s" transform="translate(428 24) scale(0.65)"/>
    <use href="#s" transform="translate(495 108) scale(0.75)"/>
    <use href="#s" transform="translate(562 50) scale(0.5)"/>
    <use href="#s" transform="translate(626 92) scale(0.7)"/>
    <use href="#s" transform="translate(700 34) scale(0.6)"/>
    <use href="#s" transform="translate(766 78) scale(0.85)"/>
    <use href="#s" transform="translate(830 26) scale(0.55)"/>
    <use href="#s" transform="translate(895 112) scale(0.7)"/>
    <use href="#s" transform="translate(960 52) scale(0.5)"/>
    <use href="#s" transform="translate(1095 30) scale(0.7)"/>
    <use href="#s" transform="translate(1160 78) scale(0.6)"/>
    <use href="#s" transform="translate(1220 42) scale(0.85)"/>
    <use href="#s" transform="translate(1255 102) scale(0.55)"/>

    <!-- left band -->
    <use href="#s" transform="translate(36 162) scale(0.8)"/>
    <use href="#s" transform="translate(92 222) scale(0.55)"/>
    <use href="#s" transform="translate(160 178) scale(0.65)"/>
    <use href="#s" transform="translate(220 252) scale(0.7)"/>
    <use href="#s" transform="translate(50 296) scale(0.6)"/>
    <use href="#s" transform="translate(130 340) scale(0.85)"/>
    <use href="#s" transform="translate(200 372) scale(0.55)"/>
    <use href="#s" transform="translate(76 410) scale(0.7)"/>
    <use href="#s" transform="translate(168 290) scale(0.5)"/>
    <use href="#s" transform="translate(262 320) scale(0.6)"/>
    <use href="#s" transform="translate(320 380) scale(0.7)"/>
    <use href="#s" transform="translate(292 216) scale(0.55)"/>
    <use href="#s" transform="translate(40 250) scale(0.65)"/>
    <use href="#s" transform="translate(258 168) scale(0.55)"/>

    <!-- right band -->
    <use href="#s" transform="translate(1080 202) scale(0.65)"/>
    <use href="#s" transform="translate(1160 178) scale(0.85)"/>
    <use href="#s" transform="translate(1240 224) scale(0.6)"/>
    <use href="#s" transform="translate(970 272) scale(0.55)"/>
    <use href="#s" transform="translate(1052 322) scale(0.7)"/>
    <use href="#s" transform="translate(1130 282) scale(0.55)"/>
    <use href="#s" transform="translate(1212 342) scale(0.7)"/>
    <use href="#s" transform="translate(1255 380) scale(0.55)"/>
    <use href="#s" transform="translate(1170 412) scale(0.85)"/>
    <use href="#s" transform="translate(1092 382) scale(0.6)"/>
    <use href="#s" transform="translate(995 382) scale(0.5)"/>
    <use href="#s" transform="translate(1240 272) scale(0.6)"/>
    <use href="#s" transform="translate(1142 362) scale(0.55)"/>
    <use href="#s" transform="translate(1018 240) scale(0.5)"/>
    <use href="#s" transform="translate(1196 132) scale(0.55)"/>

    <!-- bottom band (under tagline) -->
    <use href="#s" transform="translate(402 380) scale(0.55)"/>
    <use href="#s" transform="translate(492 425) scale(0.6)"/>
    <use href="#s" transform="translate(562 405) scale(0.5)"/>
    <use href="#s" transform="translate(652 425) scale(0.55)"/>
    <use href="#s" transform="translate(722 405) scale(0.5)"/>
    <use href="#s" transform="translate(812 395) scale(0.6)"/>
    <use href="#s" transform="translate(882 425) scale(0.55)"/>
    <use href="#s" transform="translate(437 412) scale(0.5)"/>
    <use href="#s" transform="translate(906 390) scale(0.65)"/>

    <!-- middle gap (faint) -->
  </g>
  <g fill="#f5ede0" opacity="0.45">
    <use href="#s" transform="translate(420 268) scale(0.4)"/>
    <use href="#s" transform="translate(560 282) scale(0.4)"/>
    <use href="#s" transform="translate(700 274) scale(0.4)"/>
    <use href="#s" transform="translate(840 270) scale(0.4)"/>
    <use href="#s" transform="translate(372 138) scale(0.4)"/>
    <use href="#s" transform="translate(910 142) scale(0.4)"/>
  </g>

  <!-- satellite on orbit (upper right) -->
  <g transform="translate(1000 72) rotate(-20)">
    <!-- left solar panel -->
    <rect x="-23" y="-5" width="14" height="10" fill="#000000" stroke="#3a3a3a" stroke-width="0.6"/>
    <line x1="-16" y1="-5" x2="-16" y2="5" stroke="#3a3a3a" stroke-width="0.4"/>
    <!-- right solar panel -->
    <rect x="9" y="-5" width="14" height="10" fill="#000000" stroke="#3a3a3a" stroke-width="0.6"/>
    <line x1="16" y1="-5" x2="16" y2="5" stroke="#3a3a3a" stroke-width="0.4"/>
    <!-- body -->
    <rect x="-7" y="-9" width="14" height="18" fill="#0d0d0d" stroke="#5a5a5a" stroke-width="0.8"/>
  </g>

  <!-- centered lockup: logo (left) + SPACY wordmark (right) -->
  <!-- logo center at (439 200), scale 0.5 -->
  <g transform="translate(439 200) scale(0.5)">
    <g transform="rotate(-22)" fill="#f5ede0" fill-rule="evenodd">
      <path d="M -86 -78 L -34 -78 L -34 -58 L -52 -58 L -52 58 L -34 58 L -34 78 L -86 78 L -86 58 L -68 58 L -68 -58 L -86 -58 Z"/>
      <path d="M 34 -78 L 86 -78 L 86 -58 L 68 -58 L 68 58 L 86 58 L 86 78 L 34 78 L 34 58 L 52 58 L 52 -58 L 34 -58 Z"/>
      <path d="M -34 -22 L -8 -22 L -8 -2 L 8 -2 L 8 -22 L 34 -22 L 34 22 L 8 22 L 8 2 L -8 2 L -8 22 L -34 22 Z"/>
    </g>
  </g>

  <!-- spacy wordmark -->
  <text x="524" y="238"
        font-family="'JetBrains Mono', 'IBM Plex Mono', 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="116" font-weight="800" letter-spacing="2" fill="#f5ede0">spacy</text>

  <!-- tagline -->
  <text x="640" y="320" text-anchor="middle"
        font-family="'JetBrains Mono', 'IBM Plex Mono', 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="30" font-weight="700">
    <tspan fill="#f5ede0">Privy for the </tspan><tspan fill="#e8c275">post-quantum world.</tspan>
  </text>

  <!-- Sign in with Google pill (echo Image #2) -->
  <g transform="translate(640 388)">
    <rect x="-110" y="-19" width="220" height="38" rx="4" fill="none" stroke="#e8c275" stroke-width="1"/>
    <text x="0" y="6" text-anchor="middle"
          font-family="'JetBrains Mono', 'IBM Plex Mono', 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
          font-size="13" fill="#e8c275" letter-spacing="0.6">Sign in with Google</text>
  </g>
</svg>
