<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" role="img" aria-label="Trust chain: Intel TDX → AMD SEV-SNP → SpaceComputer satellite → IPFS CID → Sepolia event">
  <title>Spacy trust chain — verifiable offline</title>
  <defs>
    <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"  stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="link" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" rx="14" fill="url(#bg2)"/>

  <!-- connecting line -->
  <line x1="80" y1="70" x2="1120" y2="70" stroke="url(#link)" stroke-width="1.25"/>

  <!-- nodes: 5 evenly spaced -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <!-- node template: pill rect + label + sublabel -->
    <g transform="translate(140 70)">
      <rect x="-78" y="-22" width="156" height="44" rx="22" fill="#0b0717" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text y="-2"  font-size="14" font-weight="700" fill="#ffffff">INTEL TDX</text>
      <text y="14"  font-size="10" fill="#a78bfa" opacity="0.85">signer</text>
      <text y="46"  font-size="10" fill="#cbb7ff" opacity="0.7">root CA</text>
    </g>
    <g transform="translate(380 70)">
      <rect x="-86" y="-22" width="172" height="44" rx="22" fill="#0b0717" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text y="-2"  font-size="14" font-weight="700" fill="#ffffff">AMD SEV-SNP</text>
      <text y="14"  font-size="10" fill="#a78bfa" opacity="0.85">coordinator</text>
      <text y="46"  font-size="10" fill="#cbb7ff" opacity="0.7">AMD ARK</text>
    </g>
    <g transform="translate(620 70)">
      <rect x="-86" y="-22" width="172" height="44" rx="22" fill="#0b0717" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text y="-2"  font-size="14" font-weight="700" fill="#ffffff">SATELLITE</text>
      <text y="14"  font-size="10" fill="#a78bfa" opacity="0.85">cTRNG witness</text>
      <text y="46"  font-size="10" fill="#cbb7ff" opacity="0.7">SpaceComputer</text>
    </g>
    <g transform="translate(860 70)">
      <rect x="-78" y="-22" width="156" height="44" rx="22" fill="#0b0717" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text y="-2"  font-size="14" font-weight="700" fill="#ffffff">IPFS</text>
      <text y="14"  font-size="10" fill="#a78bfa" opacity="0.85">receipt</text>
      <text y="46"  font-size="10" fill="#cbb7ff" opacity="0.7">CIDv1 · Pinata</text>
    </g>
    <g transform="translate(1080 70)">
      <rect x="-78" y="-22" width="156" height="44" rx="22" fill="#0b0717" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text y="-2"  font-size="14" font-weight="700" fill="#ffffff">SEPOLIA</text>
      <text y="14"  font-size="10" fill="#a78bfa" opacity="0.85">discovery index</text>
      <text y="46"  font-size="10" fill="#cbb7ff" opacity="0.7">on-chain event</text>
    </g>
  </g>

  <!-- corner caption -->
  <text x="20" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="10" fill="#a78bfa" opacity="0.75" letter-spacing="2">
    VERIFY OFFLINE →
  </text>
</svg>
