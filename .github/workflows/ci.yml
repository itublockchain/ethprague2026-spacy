name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: bun install

      - run: bun run lint
      - run: bun run typecheck

      # @spacy/contracts wants `forge` (Foundry) which we don't install in CI;
      # the artifact only matters at deploy time and the contract is already
      # on Sepolia. Build everything else.
      - run: bun run --filter @spacy-computer/sdk --filter @spacy/web --filter @spacy/api build
